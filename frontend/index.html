<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0b5d48" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KGS Staff" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="KGS Staff — warehouse transfers for Khandelwal General Stores" />
    <link rel="manifest" href="/staff/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/trustbit_school_book_seller/staff/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/trustbit_school_book_seller/staff/icons/apple-touch-icon-180.png" />
    <title>KGS Staff</title>
    <!--
      Loading screen. It is drawn from this page alone (no app code needed), so a
      phone never shows a blank or black screen while the app downloads. Vue
      replaces it when the first screen is ready (src/main.js). Colours copy
      src/tokens.css: page #f4f6f5, brand #0b5d48, line #dde3e0, ink #17201c / #46524d / #5d6a64.
      This file is rendered through Jinja on the server: never write two curly
      braces in a row, or a curly brace followed by % or # (postbuild checks).
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #f4f6f5;
      }
      #kgs-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: #17201c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      }
      #kgs-splash .kgs-mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #0b5d48;
      }
      #kgs-splash .kgs-name {
        margin-top: 14px;
        font-size: 19px;
        font-weight: 700;
      }
      #kgs-splash .kgs-spin {
        width: 30px;
        height: 30px;
        margin-top: 28px;
        box-sizing: border-box;
        border: 3px solid #dde3e0;
        border-top-color: #0b5d48;
        border-radius: 50%;
        animation: kgs-spin 0.8s linear infinite;
      }
      #kgs-splash .kgs-msg {
        margin-top: 12px;
        font-size: 15px;
        color: #46524d;
      }
      #kgs-splash .kgs-again {
        display: none;
        margin-top: 16px;
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 12px;
        background: #0b5d48;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
      }
      #kgs-splash.kgs-slow .kgs-again {
        display: block;
      }
      #kgs-splash.kgs-failed .kgs-spin {
        display: none;
      }
      #kgs-splash .kgs-foot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(24px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        color: #5d6a64;
      }
      #kgs-splash .kgs-foot img {
        height: 24px;
        width: auto;
      }
      @keyframes kgs-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #kgs-splash .kgs-spin {
          animation-duration: 2.4s;
        }
      }
    </style>
    <script>
      // Still on the loading screen after 12 s, or the app's code failed to
      // download: say so and offer "Try again". Does nothing once the app is up.
      // In <head> so it is listening before the app's own script tag (Vite
      // puts that in <head> too).
      ;(function () {
        function show(text, failed) {
          var s = document.getElementById("kgs-splash")
          if (!s) {
            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", function () {
                show(text, failed)
              })
            }
            return // the app is already on screen
          }
          s.className = failed ? "kgs-slow kgs-failed" : "kgs-slow"
          document.getElementById("kgs-splash-msg").textContent = text
        }
        var timer = setTimeout(function () {
          show("Still loading. The internet seems slow.", false)
        }, 12000)
        window.addEventListener(
          "error",
          function (e) {
            var el = e.target
            if (!el || !el.tagName) return
            var tag = el.tagName.toLowerCase()
            if (tag === "script" || (tag === "link" && /stylesheet|modulepreload/.test(el.rel))) {
              clearTimeout(timer)
              show("Couldn't load the app. Check the internet, then try again.", true)
            }
          },
          true
        )
      })()
    </script>
    <!-- staff:jinja-head -->
  </head>
  <body>
    <div id="app">
      <div id="kgs-splash">
        <img class="kgs-mark" src="/assets/trustbit_school_book_seller/staff/icons/icon-192.png" alt="" width="72" height="72" />
        <div class="kgs-name">KGS Staff</div>
        <div class="kgs-spin" aria-hidden="true"></div>
        <div id="kgs-splash-msg" class="kgs-msg" role="status" aria-live="polite">Loading…</div>
        <button type="button" class="kgs-again" onclick="location.reload()">Try again</button>
        <div class="kgs-foot">
          <span>Powered by</span>
          <img src="/assets/trustbit_school_book_seller/staff/icons/trustbit-logo.png" alt="Trustbit" width="72" height="24" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
