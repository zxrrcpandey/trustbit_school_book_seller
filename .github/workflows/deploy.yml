name: Deploy to Production (splashbox.in) — MANUAL ONLY

# The push trigger is deliberately REMOVED.
#
# This workflow SSHes to `secrets.SERVER_HOST` and runs `bench backup`,
# `bench migrate`, `bench build` and `supervisorctl restart all`. On the push
# trigger, merging any documentation typo into `main` restarted production
# services — and it still named the decommissioned host `kgs.trustbit.cloud`,
# so it would either deploy to a dead box or run a migrate for a site that does
# not exist on the live one.
#
# Production also trades 10:30-19:30 IST on a 1-core server, and CLAUDE.md
# forbids backups, migrates, builds and restarts inside that window — which an
# automatic trigger cannot know about. Run it by hand, outside shop hours.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            BENCH_PATH="/home/frappe_user/frappe-bench"
            SITE="splashbox.in"
            APP="trustbit_school_book_seller"
            BACKUP_DIR="$BENCH_PATH/sites/$SITE/private/backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            echo "=== Cleaning stale app references ==="
            cd "$BENCH_PATH"
            for stale_app in apps/*_backup_*; do
              if [ -d "$stale_app" ]; then
                stale_name=$(basename "$stale_app")
                echo "Removing stale app: $stale_name"
                rm -rf "$stale_app"
                sed -i "/$stale_name/d" sites/apps.txt 2>/dev/null || true
              fi
            done

            echo "=========================================="
            echo "=== STEP 1: TAKING FULL BACKUP ==="
            echo "=========================================="
            echo "Backup timestamp: $TIMESTAMP"
            su - frappe_user -c "cd $BENCH_PATH && bench --site $SITE backup --with-files"

            # Verify backup was created successfully
            LATEST_BACKUP=$(ls -t "$BACKUP_DIR"/*-database.sql.gz 2>/dev/null | head -1)
            if [ -z "$LATEST_BACKUP" ]; then
              echo "ERROR: Backup verification failed - no backup file found!"
              echo "ABORTING deployment to protect production data."
              exit 1
            fi

            BACKUP_SIZE=$(stat -c%s "$LATEST_BACKUP" 2>/dev/null || stat -f%z "$LATEST_BACKUP" 2>/dev/null)
            if [ "$BACKUP_SIZE" -lt 1000 ]; then
              echo "ERROR: Backup file is suspiciously small ($BACKUP_SIZE bytes)!"
              echo "ABORTING deployment to protect production data."
              exit 1
            fi

            echo "Backup verified: $LATEST_BACKUP ($BACKUP_SIZE bytes)"

            # Clean up old backups - keep last 10
            echo "=== Cleaning old backups (keeping last 10) ==="
            cd "$BACKUP_DIR"
            ls -t *-database.sql.gz 2>/dev/null | tail -n +11 | while read f; do
              base="${f%-database.sql.gz}"
              echo "Removing old backup: $base"
              rm -f "${base}"*
            done
            cd "$BENCH_PATH"

            echo "=========================================="
            echo "=== STEP 2: INSTALLING/UPDATING APP ==="
            echo "=========================================="
            if [ ! -d "$BENCH_PATH/apps/$APP" ]; then
              echo "App not found, installing for the first time..."
              su - frappe_user -c "cd $BENCH_PATH && bench get-app https://github.com/zxrrcpandey/trustbit_school_book_seller.git"
              su - frappe_user -c "cd $BENCH_PATH && bench --site $SITE install-app $APP"
            else
              cd "$BENCH_PATH/apps/$APP"
              git config --global --add safe.directory "$BENCH_PATH/apps/$APP"
              REMOTE=$(git remote | head -1)
              git fetch "$REMOTE" main
              git reset --hard "$REMOTE/main"
            fi

            echo "=== Fixing permissions ==="
            chown -R frappe_user:frappe_user "$BENCH_PATH/apps/$APP"
            chmod 755 "$BENCH_PATH/apps/$APP"
            chmod -R o+rX "$BENCH_PATH/apps/$APP"

            echo "=========================================="
            echo "=== STEP 3: RUNNING MIGRATE ==="
            echo "=========================================="
            su - frappe_user -c "cd $BENCH_PATH && bench --site $SITE migrate"

            echo "=========================================="
            echo "=== STEP 4: BUILDING ASSETS ==="
            echo "=========================================="
            su - frappe_user -c "cd $BENCH_PATH && bench build --app $APP"

            echo "=== Clearing cache ==="
            su - frappe_user -c "cd $BENCH_PATH && bench --site $SITE clear-cache"

            echo "=========================================="
            echo "=== STEP 5: RESTARTING SERVICES ==="
            echo "=========================================="
            supervisorctl restart all 2>/dev/null || su - frappe_user -c "cd $BENCH_PATH && bench restart"

            echo "=========================================="
            echo "=== DEPLOYMENT COMPLETE! ==="
            echo "=========================================="
            echo "Site: $SITE"
            echo "Backup: $LATEST_BACKUP"
            echo "Timestamp: $TIMESTAMP"
