name: Deploy to Production (kgs.trustbit.cloud)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            BENCH_PATH="/home/frappe_user/frappe-bench"
            SITE="kgs.trustbit.cloud"
            APP="trustbit_school_book_seller"

            echo "=== Cleaning stale app references ==="
            cd "$BENCH_PATH"
            for stale_app in apps/*_backup_*; do
              if [ -d "$stale_app" ]; then
                stale_name=$(basename "$stale_app")
                echo "Removing stale app: $stale_name"
                rm -rf "$stale_app"
                sed -i "/$stale_name/d" sites/apps.txt 2>/dev/null || true
              fi
            done

            echo "=== Taking backup ==="
            su - frappe_user -c "cd $BENCH_PATH && bench --site $SITE backup"

            echo "=== Installing/Updating app ==="
            if [ ! -d "$BENCH_PATH/apps/$APP" ]; then
              echo "App not found, installing for the first time..."
              su - frappe_user -c "cd $BENCH_PATH && bench get-app https://github.com/zxrrcpandey/trustbit_school_book_seller.git"
              su - frappe_user -c "cd $BENCH_PATH && bench --site $SITE install-app $APP"
            else
              cd "$BENCH_PATH/apps/$APP"
              git config --global --add safe.directory "$BENCH_PATH/apps/$APP"
              # bench get-app uses 'upstream' as remote name
              REMOTE=$(git remote | head -1)
              git fetch "$REMOTE" main
              git reset --hard "$REMOTE/main"
            fi

            echo "=== Fixing permissions ==="
            chown -R frappe_user:frappe_user "$BENCH_PATH/apps/$APP"
            chmod 755 "$BENCH_PATH/apps/$APP"
            chmod -R o+rX "$BENCH_PATH/apps/$APP"

            echo "=== Running migrate ==="
            su - frappe_user -c "cd $BENCH_PATH && bench --site $SITE migrate"

            echo "=== Building assets ==="
            su - frappe_user -c "cd $BENCH_PATH && bench build --app $APP"

            echo "=== Clearing cache ==="
            su - frappe_user -c "cd $BENCH_PATH && bench --site $SITE clear-cache"

            echo "=== Restarting services ==="
            supervisorctl restart all 2>/dev/null || su - frappe_user -c "cd $BENCH_PATH && bench restart"

            echo "=== Deployment complete! ==="
